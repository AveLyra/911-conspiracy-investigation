[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collapse-reconstruction-workbench"
version = "0.1.0"
description = "Reproducible evidence and provenance core for CRW"
requires-python = ">=3.10"
dependencies = [
  "jsonschema[format]>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
crw = "crw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
